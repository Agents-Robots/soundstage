[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soundstage"
version = "0.1.0"
description = "Offline spatial sound rendering for Blender animations"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Christian Gloor" }]
requires-python = ">=3.12"
keywords = ["blender", "spatial-audio", "doppler", "sound-design", "animation", "offline-rendering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "soxr>=0.4",
    "numba>=0.60",
    "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
hrtf = ["sofar>=1.1"]
dev = ["pytest>=8", "matplotlib>=3.8", "ruff>=0.8"]

[project.urls]
Homepage = "https://agents-robots.github.io/soundstage/"
Repository = "https://github.com/Agents-Robots/soundstage"
Issues = "https://github.com/Agents-Robots/soundstage/issues"

[project.scripts]
soundstage = "soundstage.cli:main"

[tool.setuptools.packages.find]
include = ["soundstage*"]

[tool.setuptools.package-data]
"soundstage.engine" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "blender: needs the blender binary on PATH (end-to-end tests)",
    "slow: renders longer clips",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["research/papers/pdf"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = [
    "E501",   # lines are kept near 120 by hand; a few run longer
    "E741",   # single-letter names (l, r) in DSP formulas
    "B023",   # closures over loop variables are used at once in pool.map
    "B905",   # zip without strict: the lengths match by construction
    "UP007",  # Optional[X] is not used; X | None is, but numba kernels keep plain signatures
    "UP017",  # datetime.timezone.utc: Blender's Python may be older than 3.11
]

[tool.ruff.lint.per-file-ignores]
"research/experiments/scripts/*" = ["E702"]  # node-graph setup packs several short statements per line

[tool.ruff.lint.isort]
known-first-party = ["soundstage"]
known-local-folder = ["conftest", "common"]
