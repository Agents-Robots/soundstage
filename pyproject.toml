[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "soundstage"
version = "0.0.1"
description = "Offline spatial sound rendering for script-generated Blender animations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "soxr>=0.4",
    "numba>=0.60",
    "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
hrtf = ["sofar>=1.1"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
soundstage = "soundstage.cli:main"

[tool.setuptools.packages.find]
include = ["soundstage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "blender: needs the blender binary on PATH (end-to-end tests)",
    "slow: renders longer clips",
]
