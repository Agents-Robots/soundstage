# Recorded sounds of the showcase (sounds/README.md, "Recorded", requirement A7).
#
# Every entry is CC0. fetch.py downloads the file named by `page` and `download`, checks its
# SHA-256 and its licence on the page, and applies `process` to write the sounds in `names`.
# Freesound HQ previews are MP3 at 128 kbit/s (the A6 exception for engines; footsteps lose
# nothing audible below 16 kHz either, fireworks are heard from 500 m, where the air takes
# everything above 8 kHz, and tennis hits from 40 m; the accordion, the basketball and the claps
# carry most of their energy below 8 kHz).

